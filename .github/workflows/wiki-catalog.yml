name: Refresh comprehensive Hot Wheels Wiki v6 catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 1 * *"
  push:
    paths:
      - ".github/workflows/wiki-catalog.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wiki-catalog-refresh
  cancel-in-progress: true

jobs:
  refresh:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download upstream Wiki v6 catalogue builder
        run: git clone --depth 1 https://github.com/ktrizolio/hotwheels-fandom-db.git /tmp/wiki-builder
      - name: Install upstream dependencies
        run: python -m pip install -r /tmp/wiki-builder/scraper/requirements.txt
      - name: Build full catalogue from official Fandom MediaWiki API
        working-directory: /tmp/wiki-builder
        run: python scraper/atualizar_db.py
      - name: Compress and check output
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/wiki-builder/saida -name hotwheels_db_v6.jsonl -print
          file="$(find /tmp/wiki-builder/saida -name hotwheels_db_v6.jsonl | sort | tail -n 1)"
          test -n "$file"
          mkdir -p catalog
          python - "$file" <<'PY'
          import sys, gzip, json, pathlib
          p=pathlib.Path(sys.argv[1])
          n=0
          with p.open(encoding='utf-8') as source, gzip.open('catalog/wiki-v6.jsonl.gz','wt',encoding='utf-8',compresslevel=9) as out:
              for line in source:
                  if not line.strip(): continue
                  row=json.loads(line)
                  if not row.get('model_name') or not row.get('id'): continue
                  out.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
                  n+=1
          print('Wiki v6 rows:',n)
          if n < 10000: raise SystemExit('Refusing unexpectedly small catalogue')
          packs=p.with_name('containers_v6.jsonl')
          pack_count=0
          if packs.exists():
              with packs.open(encoding='utf-8') as source, gzip.open('catalog/wiki-packs.jsonl.gz','wt',encoding='utf-8',compresslevel=9) as out:
                  for line in source:
                      if not line.strip(): continue
                      row=json.loads(line)
                      if row.get('type') != 'pack' or not row.get('title'): continue
                      out.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
                      pack_count+=1
          print('Wiki v6 packs:',pack_count)
          if pack_count < 100: raise SystemExit('Refusing unexpectedly small packs catalogue')
          from datetime import datetime, timezone
          stats={
              'releases':n,
              'packs':pack_count,
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'source':'Hot Wheels Wiki via ktrizolio/hotwheels-fandom-db v6',
              'note':'Source records are community-documented; not a verified complete global product census.'
          }
          pathlib.Path('catalog/wiki-stats.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Wiki statistics:',stats)
          PY
      - name: Commit refreshed catalogue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/wiki-v6.jsonl.gz catalog/wiki-packs.jsonl.gz catalog/wiki-stats.json
          if git diff --cached --quiet; then echo "Catalogue unchanged"; exit 0; fi
          git commit -m "data: refresh Wiki v6 catalogue"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Catalogue committed on main"
              exit 0
            fi
            echo "Remote main moved during catalogue generation; rebasing attempt $attempt"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not publish refreshed Wiki catalogue"
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Bundle main catalogue scan index
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            "https://raw.githubusercontent.com/danyjoy/diecastDb/main/data/scan-index.json"
            "https://cdn.jsdelivr.net/gh/danyjoy/diecastDb@main/data/scan-index.json"
            "https://danyjoy.github.io/diecastDb/data/scan-index.json"
          )
          for url in "${sources[@]}"; do
            if curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 --silent --show-error "$url" -o catalog/scan-index.json; then
              if node -e "const c=JSON.parse(require('fs').readFileSync('catalog/scan-index.json','utf8'));if(!Array.isArray(c.cars)||c.cars.length<10000)process.exit(1)"; then break; fi
            fi
            rm -f catalog/scan-index.json
          done
          test -s catalog/scan-index.json || echo "::warning::Mainline scan index unavailable; app can still load external providers at runtime"
      - name: Validate app and parser before Wiki v6 deployment
        run: |
          node scripts/validate-app.mjs
          node scripts/test-catalog.mjs
          node scripts/test-cloud-3d.mjs
          node scripts/test-stream-import.mjs
      - name: Verify full Wiki v6 archive and 5-pack contents
        run: node scripts/validate-full-catalog.mjs
      - name: Install 3D module dependencies
        run: npm install --no-save three@0.170.0 esbuild@0.24.2
      - name: Prepare standalone production site with bundled 3D
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/catalog
          cp index.html seed.js sw.js manifest.webmanifest icon.svg icon-192.png _site/
          npx esbuild viewer3d.js --bundle --format=esm --target=es2020 --minify --outfile=_site/viewer3d.js
          test -s _site/viewer3d.js
          cp -a catalog/. _site/catalog/
      - name: Upload Pages site with Wiki v6 catalogue
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy updated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
