name: Deploy Diecast Garage to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application JavaScript and PWA assets
        run: node scripts/validate-app.mjs
      - name: Validate catalog normalization and classification
        run: node scripts/test-catalog.mjs
      - name: Verify independent Wiki multipack refresh
        run: node scripts/test-pack-only-import.mjs
      - name: Test multipack wishlist and backup compatibility
        run: node scripts/test-pack-wishlist.mjs
      - name: Stress-test streamed Wiki importer on 10k records
        run: node scripts/test-stream-import.mjs
      - name: Prevent overlapping full Wiki imports
        run: node scripts/test-wiki-import-lock.mjs
      - name: Verify private GLB cloud adapter and RLS
        run: node scripts/test-cloud-3d.mjs
      - name: Verify full Wiki v6 archive and 5-pack contents
        run: node scripts/validate-full-catalog.mjs
      - name: Audit real catalog photo URL coverage
        run: node scripts/audit-photo-coverage.mjs
      - name: Install Chromium and local 3D build dependencies
        run: |
          npm install --no-save playwright three@0.170.0 esbuild@0.24.2
          npx playwright install --with-deps chromium
      - name: Build self-contained 3D app for browser tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/catalog
          cp index.html seed.js sw.js manifest.webmanifest icon.svg icon-192.png _site/
          npx esbuild viewer3d.js --bundle --format=esm --target=es2020 --minify --outfile=_site/viewer3d.js
          test -s _site/viewer3d.js
      - name: Mobile app browser smoke test
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory _site >/tmp/diecast-http.log 2>&1 &
          sleep 2
          if ! node scripts/browser-smoke.mjs; then
            echo "::warning::Mobile browser smoke failed on first attempt; retrying once to distinguish transient browser failures from reproducible regressions"
            node scripts/browser-smoke.mjs
          fi
      - name: Upload mobile browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Bundle full catalogue index for reliable first launch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog
          sources=(
            "https://raw.githubusercontent.com/danyjoy/diecastDb/main/data/scan-index.json"
            "https://cdn.jsdelivr.net/gh/danyjoy/diecastDb@main/data/scan-index.json"
            "https://danyjoy.github.io/diecastDb/data/scan-index.json"
          )
          for source in "${sources[@]}"; do
            if curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 --silent --show-error "$source" -o catalog/scan-index.json; then
              if node -e "const c=JSON.parse(require('fs').readFileSync('catalog/scan-index.json','utf8'));if(!Array.isArray(c.fields)||!Array.isArray(c.cars)||c.cars.length<10000)process.exit(1)"; then
                echo "Catalogue index bundled successfully"
                break
              fi
            fi
            rm -f catalog/scan-index.json
          done
          test -s catalog/scan-index.json || echo "::warning::Mainline scan index unavailable; app can still load external providers at runtime"
      - name: Prepare minimal production site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/catalog
          cp index.html seed.js sw.js manifest.webmanifest icon.svg icon-192.png _site/
          cp -a catalog/. _site/catalog/
      - name: Restore verified image cache
        uses: actions/cache@v4
        with:
          path: _site/car-photos
          key: diecast-photo-library-v1-${{ hashFiles('catalog/wiki-v6.jsonl.gz','scripts/build-photo-library.py') }}
      - name: Generate locally cached, verified car photographs
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/build-photo-library.py
          test -s _site/catalog/local-car-photos.json
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
