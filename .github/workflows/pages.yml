name: Deploy Diecast Garage to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application JavaScript and PWA assets
        run: node scripts/validate-app.mjs
      - name: Validate catalog normalization and classification
        run: node scripts/test-catalog.mjs
      - name: Install Playwright and Chromium for browser smoke
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Mobile app browser smoke test
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/diecast-http.log 2>&1 &
          sleep 2
          node scripts/browser-smoke.mjs
      - name: Bundle full catalogue index for reliable first launch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog
          sources=(
            "https://raw.githubusercontent.com/danyjoy/diecastDb/main/data/scan-index.json"
            "https://cdn.jsdelivr.net/gh/danyjoy/diecastDb@main/data/scan-index.json"
            "https://danyjoy.github.io/diecastDb/data/scan-index.json"
          )
          for source in "${sources[@]}"; do
            if curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 --silent --show-error "$source" -o catalog/scan-index.json; then
              if node -e "const c=JSON.parse(require('fs').readFileSync('catalog/scan-index.json','utf8'));if(!Array.isArray(c.fields)||!Array.isArray(c.cars)||c.cars.length<10000)process.exit(1)"; then
                echo "Catalogue index bundled successfully"
                break
              fi
            fi
            rm -f catalog/scan-index.json
          done
          test -s catalog/scan-index.json || { echo "::error::No valid catalog index available"; exit 1; }
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
